name: Build study guide PDF

on:
  workflow_dispatch:
    inputs:
      guide:
        description: 'Choose the study guide'
        required: true
        default: partial-2
        type: choice
        options:
          - partial-1
          - partial-2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: study-guide/${{ inputs.guide }}
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: LDS1071-${{ inputs.guide }}-${{ steps.vars.outputs.short_sha }}
          path: study-guide/${{ inputs.guide }}/main.pdf
          retention-days: 30
          if-no-files-found: error
